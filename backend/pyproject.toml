[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-digital-twin-backend"
version = "1.0.0"
description = "Predictive-maintenance backend for the Fleet Digital Twin"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "xgboost>=2.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
# httpx is required transitively by fastapi.testclient, which every test uses.
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13"]

# `rul` is the feature contract that app/ml/features.py imports. It lives at
# ../ml/src/rul and is NOT published to PyPI, so it cannot be a dependency here:
# pip would resolve it against the index and fail with "No matching distribution
# found for rul". Instead this wheel ships it — `where` lists both roots, so the
# package is found at ../ml/src and packed alongside `app`.
#
# The consequence is that `pip install ./backend` alone is a complete install, with
# no ordering requirement against a separate `pip install ./ml`. That matters
# because the deploy target's build command is configuration we do not fully
# control: Render stores the Blueprint's buildCommand at service-creation time and
# does not re-read render.yaml on later deploys, so a build command that predates
# this change kept failing long after the fix was on main.
#
# `where` is relative to this pyproject.toml, so any consumer must keep backend/ and
# ml/ as siblings — see the builder stage of docker/backend/Dockerfile, which copies
# them into /build/backend and /build/ml for exactly that reason.
[tool.setuptools.packages.find]
where = [".", "../ml/src"]
include = ["app*", "rul*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4"]
# B008: FastAPI Depends() in defaults is idiomatic
# F821: SQLAlchemy Mapped["X"] forward refs are resolved by the ORM, not by ruff
# E501: line length is enforced by the formatter, not the linter
ignore = ["B008", "F821", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806", "UP042", "B905", "SIM117", "F841"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
exclude = ["alembic/versions"]
# The `rul` contract package lives in ../ml/src and is installed editable, but
# mypy cannot always follow the editable hook — so resolve it from source.
# (CI also passes ../ml/src/rul/contract explicitly, which adds the same dir;
# this just makes the resolution independent of CLI arguments.)
mypy_path = ["../ml/src"]

[[tool.mypy.overrides]]
module = ["xgboost.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
