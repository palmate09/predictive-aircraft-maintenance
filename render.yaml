# Render blueprint — single free web service + Aiven free Postgres.
#
# One service, not two, and that is not a simplification: `frontend/src/lib/api.js`
# derives both its REST base and its WebSocket URL from `window.location.origin`, and a
# Render Static Site can only do redirects and headers, never reverse-proxy `/api` or
# upgrade `/ws`. Splitting the tiers would break every API call. Serving the Vite build
# from the FastAPI process keeps REST and the WebSocket same-origin, which also removes
# CORS from the picture entirely.
#
# Database: create a free PostgreSQL service (Render's own, or Aiven, or Neon) and paste
# its URL into FDT_DATABASE_URL below.
#
# Paste it EXACTLY as the provider gives it. A bare `postgres://...` is fine — Settings
# rewrites the bare libpq schemes onto `postgresql+psycopg://` for you, because SQLAlchemy 2
# will not load the pinned psycopg (v3) driver otherwise and the failure reads like a broken
# build. Keep `sslmode=require` if the provider includes it.
#
# Set `region` to match the database service's region.

services:
  - type: web
    name: fleet-digital-twin
    runtime: python
    plan: free
    region: singapore

    # `./ml` is named in the SAME pip invocation as `./backend`, not as a separate
    # `pip install ./ml` step. backend/pyproject.toml lists `rul` as a runtime
    # dependency and `rul` is this repo's local package under ./ml — it is never
    # published to PyPI. Installing them together lets pip resolve `rul` against the
    # local project; installing ./backend alone makes it hit the index and die with
    # "No matching distribution found for rul". docker/backend/Dockerfile installs
    # the pair in the same order.
    #
    # The leading echo is a marker: Render applies render.yaml at blueprint-creation
    # time, so if this string is absent from a build log, the service is running a
    # stale Build Command and the blueprint needs re-syncing — that silence is the
    # symptom of this exact failure and nothing in the log would otherwise say so.
    buildCommand: >-
      echo "FDT-BUILD-v3: installing ./ml and ./backend together" &&
      npm --prefix frontend ci --no-audit --no-fund &&
      npm --prefix frontend run build &&
      pip install ./ml ./backend &&
      (bash scripts/fetch-cmapss.sh --subset FD001 --quiet || true)

    # `cd backend` is load-bearing: alembic.ini has `script_location = alembic` and
    # `prepend_sys_path = .`, both relative to CWD — and the lifespan migration in
    # `app/main.py::_migrate_schema` resolves `alembic.ini` the same relative way.
    #
    # No `alembic upgrade head` here on purpose: it used to run before uvicorn bound
    # the port — a second interpreter boot plus a cross-region database round trip
    # during which Render answers every request with 502, on each cold start and
    # each deploy. Migrations now run inside the lifespan background task after the
    # port is bound (Render-only, via the RENDER env var), so the 502 window is just
    # the bare interpreter boot. See `_migrate_schema`.
    #
    # `--workers 1` is not a free-tier limit and must not be raised: the replay engine
    # is an in-process asyncio task, so a second worker would run a second replay loop
    # and double-advance every aircraft.
    #
    # `--port $PORT` because Render injects the port; the Dockerfile's 8000 will not
    # work. `--proxy-headers` so uvicorn trusts X-Forwarded-*, without which every
    # client IP in audit_log becomes Render's proxy.
    #
    # `--loop uvloop --http httptools` are the compiled pieces of uvicorn[standard]
    # (already pinned in backend/pyproject.toml): measurably less CPU per request on
    # the 0.1-CPU free instance, which is what keeps /healthz answering in
    # milliseconds while the replay tick burns the single core next door.
    # Migrations run here, not in startCommand: Render executes the pre-deploy
    # command in a temporary container while the previous revision keeps serving,
    # so a slow cross-region `upgrade head` never holds the port closed (which is
    # what the proxy turns into 502). The lifespan background migration in
    # `app/main.py::_migrate_schema` stays as a fallback — it is a one-query
    # no-op when pre-deploy already migrated, and covers first-ever deploys.
    preDeployCommand: cd backend && alembic upgrade head

    startCommand: >-
      cd backend &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
      --loop uvloop --http httptools --timeout-graceful-shutdown 20

    healthCheckPath: /healthz
    autoDeployTrigger: commit

    envVars:
      # Pinned so a Render default bump cannot drift past pyproject's
      # `requires-python = ">=3.11"`. Honoured during the build, so it must be set here
      # rather than on the service only.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.11.1"

      # Threading discipline for a 0.1-CPU / 512 MB instance. Importing xgboost
      # + numpy costs ~290 MB RSS on its own, so everything after that is fought
      # in tens of megabytes — and the BLAS/OpenMP runtimes size their thread
      # pools from the *host* CPU count, spawning a dozen threads that each hold
      # buffers while serialising on a tenth of a core. Pinning them to one
      # thread each is both leaner and faster here; it is also what keeps a
      # second device downloading the 3D scene mid-tick from tipping the process
      # into an OOM restart (which the proxy serves as 502/503).
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      # glibc carves a malloc arena per thread and never fully returns them;
      # with the replay + request threadpool churning, retained arenas were dead
      # RSS that only grew. Two arenas is plenty for one worker.
      - key: MALLOC_ARENA_MAX
        value: "2"

      # `production` is honest here. It previously had to claim
      # `staging` purely to be allowed to run with FDT_DEMO_MODE=true, since the replay
      # engine is what feeds the live twin — a misreport that made the deployment's real
      # posture invisible in its own config.
      - key: FDT_ENVIRONMENT
        value: production
      - key: FDT_DEMO_MODE
        value: "true"
      - key: FDT_LOG_LEVEL
        value: INFO

      # The only origin that may call this API. The WebSocket also accepts
      # RENDER_EXTERNAL_URL — Render's own public URL for this service, including
      # PR preview hostnames — so previews and renames keep the live stream
      # without an allowlist edit. Custom domains still need adding here.
      - key: FDT_CORS_ORIGINS
        value: https://fleet-digital-twin.onrender.com

      # Absolute, because the process runs from backend/ and these two paths are
      # resolved relative to the CWD.
      - key: FDT_DATA_DIR
        value: /opt/render/project/src/backend/data
      - key: FDT_WEB_DIST
        value: /opt/render/project/src/frontend/dist

      # The artifacts are committed to git (backend/data/ml/all, ~1.2 MB), so there is
      # nothing to fetch and FDT_ML_ARTIFACTS_URL stays unset.
      #
      # Fallback off on purpose: with the booster present it cannot trigger, and if it
      # ever did, every prediction would silently become `rul = 125 - cycle`.
      - key: FDT_ML_VARIANT
        value: all
      - key: FDT_ML_DATASET
        value: FD001
      - key: FDT_ML_FALLBACK
        value: "false"

      # Only the replayed C-MAPSS subset is held in memory. Loading all four
      # train files ballooned past hundreds of MB as per-row dicts and OOMed
      # the 512 MB free instance minutes after boot — the "down every 5 min".
      - key: FDT_CMAPSS_PRELOAD_ALL
        value: "false"

      # Aiven free caps max_connections at 20. 5 steady + 10 burst = 15, leaving
      # headroom for a pre-deploy migration and a seed alongside the live pool.
      # Matches backend/app/core/config.py defaults (db_pool_size=5,
      # db_max_overflow=10). The 3 + 2 these used to be starved under two concurrent clients: every
      # request holds its session for its full cross-region duration, so 5 slots
      # wedged and even the WebSocket handshake's COUNT query hit the 30 s pool
      # timeout — killing the live stream exactly when a second device joined.
      - key: FDT_DB_POOL_SIZE
        value: "5"
      - key: FDT_DB_MAX_OVERFLOW
        value: "10"

      # Without a horizon the replay engine's four append-only tables grow at a
      # measured ~36 KB/s (~93 GB/month) and fill this 1 GB plan in about eight hours.
      # 1h holds ~141 MB steady state and stays ~17x above the ~3.5 min wall-clock
      # lifetime of one engine's cycle range, so the history chart sees no gaps.
      # Cost is linear in the horizon: 3h would be ~400 MB, 40% of the disk.
      # See app/services/retention.py.
      - key: FDT_TELEMETRY_RETENTION_HOURS
        value: "1"
      - key: FDT_RETENTION_INTERVAL_SECONDS
        value: "300"

      # Nobody can shell into a Render free service to run `python -m app.seed.run`.
      # This no-ops once any aircraft exists, so it costs one COUNT per cold start.
      - key: FDT_SEED_ON_BOOT
        value: "true"

      - key: FDT_DATABASE_URL
        sync: false