name: keep-alive

# Health ping for the VPS deployment. There is no free-tier sleep to defend against
# here — a container on a VPS you own stays up — so the 5-minute cron that used to
# exist here has been removed; it only burned Actions minutes and pinged Render.
#
# It is kept as a manual smoke test: Actions → keep-alive → Run workflow, or as a
# third-party monitor (UptimeRobot, Better Stack, cron-job.org) pointed at
# `<base>/healthz`. It never deploys, never touches the database beyond the health
# check's own `SELECT 1`, and never fails the repo on a single miss.
#
# Setup: Settings → Secrets and variables → Actions → New repository variable
#   `FLEET_URL` with the public base URL (e.g. https://fleet.example.com). Falls back
#   to http://<VPS_HOST>:<WEB_PORT> when unset, which is what you want when there is
#   no reverse proxy or TLS in front yet.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping production /healthz
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Ping the service
        env:
          BASE: ${{ vars.FLEET_URL || format('http://{0}:8080', secrets.VPS_HOST) }}
        run: bash scripts/keep-alive.sh "$BASE"