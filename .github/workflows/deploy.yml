name: Deploy to VPS

# Runs only after CI passes on main — the `ci` workflow must be green before
# anything reaches Render or the private VPS. PRs and pushes to other branches
# trigger CI only; they never touch any live environment.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# Never deploy two builds concurrently: a half-migrated database is worse than
# waiting for the previous deploy to settle.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── guard ─────────────────────────────────────────────────────────────────────
  # workflow_run fires for both success and failure — bail out early so the
  # deploy job never runs against a broken build.
  check-ci:
    name: Guard · CI must be green
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding to deploy"

  # ── deploy ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy · Render (fleet-digital-twin)
    runs-on: ubuntu-latest
    needs: check-ci
    timeout-minutes: 10

    steps:
      - name: Trigger Render deploy hook
        # RENDER_DEPLOY_HOOK_URL is the URL from:
        #   Render dashboard → fleet-digital-twin → Settings → Deploy Hook
        # Add it as a GitHub Actions secret:
        #   Repo → Settings → Secrets and variables → Actions → New secret
        #   Name:  RENDER_DEPLOY_HOOK_URL
        #   Value: https://api.render.com/deploy/srv-...?key=...
        run: |
          response=$(curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Deploy triggered: $response"

      - name: Wait for deploy to go live
        # Poll /healthz every 15 s for up to 10 min.
        # Render's free tier builds take ~4-6 min; the generous ceiling covers
        # cold npm ci + pip install + alembic upgrade on a slow day.
        run: |
          echo "Waiting for https://fleet-digital-twin-wyz1.onrender.com to become healthy..."
          for i in $(seq 1 40); do
            status=$(curl -sf -o /dev/null -w "%{http_code}" \
              https://fleet-digital-twin-wyz1.onrender.com/healthz || echo "000")
            echo "  attempt $i/40 — HTTP $status"
            if [ "$status" = "200" ]; then
              echo "✅ Service is healthy"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Service did not become healthy within 10 minutes"
          exit 1

  # ── deploy-vps ────────────────────────────────────────────────────────────────
  deploy-vps:
    name: Deploy · Private VPS (compose prod)
    runs-on: ubuntu-latest
    needs: check-ci
    timeout-minutes: 10

    steps:
      - name: Deploy through SSH
        # Required GitHub Actions secrets (Repo → Settings → Secrets → Actions):
        #   VPS_HOST         e.g. 203.0.113.10 (or VPS hostname)
        #   VPS_USER         e.g. deploy
        #   VPS_SSH_KEY      private ed25519 key (no passphrase) matching an
        #                    authorized_keys entry for VPS_USER on the VPS
        #   VPS_KNOWN_HOSTS  output of: ssh-keyscan -t ed25519 "$VPS_HOST"
        #
        # VPS one-time prerequisites:
        #   git clone <repo> "$HOME/apps/predective-aircarft-maintainance"
        #   cp .env.example .env  # then fill real secrets
        #   Docker Engine + compose plugin installed; VPS_USER in docker group.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          trap 'rm -f ~/.ssh/id_ed25519' EXIT

          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            'set -eu
             cd "$HOME/apps/predective-aircarft-maintainance"
             git pull --ff-only origin main
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
             docker compose -f docker-compose.yml -f docker-compose.prod.yml ps'
